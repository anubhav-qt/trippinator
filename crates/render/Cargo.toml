[package]
name = "trippinator-render"
version.workspace = true
edition.workspace = true
description = "Feedback render pipeline — inject+warp, then color, into ping-pong HDR targets"

[dependencies]
trippinator-renderer-gpu = { path = "../renderer/gpu" }
trippinator-analysis-audio = { path = "../analysis/audio_analysis" }
wgpu.workspace = true
bytemuck.workspace = true
log.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Same version wgpu 24 vendors, so a shader that passes here passes at pipeline
# creation. Validating in a test means a WGSL typo fails `cargo test` instead of
# only showing up as a panic on the visualizer's first frame.
naga = { version = "24.0.0", features = ["wgsl-in"] }
