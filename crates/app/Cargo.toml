[package]
name = "trippinator-app"
version.workspace = true
edition.workspace = true
description = "Main application binary — window management, event loop, and subsystem orchestration"

[[bin]]
name = "trippinator"
path = "src/main.rs"

[dependencies]
# v1 is audio-only (see DESIGN.md). Screen capture/analysis crates still exist for v2
# but are deliberately not linked here — half-wired unused code is the failure mode
# this rewrite is trying to avoid.
trippinator-capture-audio = { path = "../capture/audio" }
trippinator-analysis-audio = { path = "../analysis/audio_analysis" }
trippinator-renderer-gpu = { path = "../renderer/gpu" }
trippinator-render = { path = "../render" }

wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
env_logger.workspace = true
log.workspace = true
anyhow.workspace = true
glam.workspace = true
crossbeam-channel.workspace = true
